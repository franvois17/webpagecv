<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with TikTok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .login-btn {
            background-color: #ff0050;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #e60048;
        }
        .user-info {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Welcome to Our App</h1>
    <p>Login with TikTok to continue</p>

    <!-- Fake "Login with TikTok" Button -->
    <button class="login-btn" onclick="redirectToTikTok()">Login with TikTok</button>

    <script>
        function redirectToTikTok() {
            alert("Redirecting to TikTok Login...");
            // Change this URL to your actual success page
            window.location.href = "https://your-app-domain.com/tiktok-login-success";
        }
    </script>

</body>
</html>
