<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Comment Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .tiktok-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #000;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: 250px;
        }
        .tiktok-login-btn img {
            width: 20px;
            height: 20px;
        }
        .centered {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }
    </style>
    <script>
        let isLoggedIn = false;

        function fakeLogin() {
            isLoggedIn = true;
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("analysisSection").style.display = "block";
            document.getElementById("welcomeMessage").innerHTML = `<h4>Welcome, TikTok User!</h4><p>You can now analyze comments from your own videos.</p>`;
        }

        function isValidTikTokURL(url) {
            return /^https?:\/\/(www\.)?tiktok\.com\/@[\w.-]+\/video\/\d+/.test(url);
        }

        function generateFakeData() {
            if (!isLoggedIn) {
                alert("Please log in with TikTok first.");
                return;
            }

            let videoURL = document.getElementById("videoURL").value.trim();
            if (!isValidTikTokURL(videoURL)) {
                alert("Please enter a valid TikTok video link.");
                return;
            }

            let totalComments = Math.floor(Math.random() * 150) + 50;
            let sentimentData = {
                positive: Math.floor(totalComments * Math.random() * 0.6),
                neutral: Math.floor(totalComments * Math.random() * 0.3),
                negative: Math.floor(totalComments * Math.random() * 0.2)
            };
            let engagement = {
                likes: Math.floor(Math.random() * 5000) + 500,
                shares: Math.floor(Math.random() * 1000) + 100,
                views: Math.floor(Math.random() * 20000) + 1000
            };
            let frequencyData = Array.from({ length: 7 }, () => Math.floor(Math.random() * 40) + 5);

            document.getElementById("summary").innerHTML = `
                <h5>Analysis Summary</h5>
                <p><strong>Video Analyzed:</strong> <a href="${videoURL}" target="_blank">View Video</a></p>
                <p><strong>Total Comments:</strong> ${totalComments}</p>
                <p><strong>Engagement:</strong> ${engagement.likes} Likes, ${engagement.shares} Shares, ${engagement.views} Views</p>
            `;

            renderCharts(sentimentData, frequencyData, engagement);
        }

        function renderCharts(sentimentData, frequencyData, engagement) {
            let ctx1 = document.getElementById('sentimentChart').getContext('2d');
            let ctx2 = document.getElementById('frequencyChart').getContext('2d');
            let ctx3 = document.getElementById('engagementChart').getContext('2d');

            new Chart(ctx1, {
                type: 'pie',
                data: {
                    labels: ['Positive', 'Neutral', 'Negative'],
                    datasets: [{
                        data: [sentimentData.positive, sentimentData.neutral, sentimentData.negative],
                        backgroundColor: ['#4CAF50', '#FFC107', '#F44336']
                    }]
                }
            });

            new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'],
                    datasets: [{
                        label: 'Comments Per Day',
                        data: frequencyData,
                        backgroundColor: '#42A5F5'
                    }]
                }
            });

            new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: ['Likes', 'Shares', 'Views'],
                    datasets: [{
                        label: 'Video Engagement',
                        data: [engagement.likes, engagement.shares, engagement.views],
                        backgroundColor: ['#2196F3', '#FFC107', '#4CAF50']
                    }]
                }
            });
        }
    </script>
</head>
<body class="container mt-5">
    <h2 class="mb-4 text-center">TikTok Comment Analysis</h2>

    <!-- Fake TikTok Login Section -->
    <div id="loginSection" class="centered">
        <button class="tiktok-login-btn" onclick="fakeLogin()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/TikTok_logo.svg" alt="TikTok Logo"> Log in with TikTok
        </button>
    </div>

    <!-- Welcome Message After Login -->
    <div id="welcomeMessage" class="mt-3 text-center"></div>

    <!-- Analysis Section (Hidden Until Logged In) -->
    <div id="analysisSection" style="display: none;">
        <div class="input-group mb-3">
            <input type="text" id="videoURL" class="form-control" placeholder="Enter your TikTok video link">
            <button class="btn btn-primary" onclick="generateFakeData()">Analyze Video</button>
        </div>

        <div id="summary" class="my-4"></div>

        <div class="row">
            <div class="col-md-4">
                <canvas id="sentimentChart"></canvas>
                <p class="text-center"><strong>Sentiment Analysis</strong></p>
            </div>
            <div class="col-md-4">
                <canvas id="frequencyChart"></canvas>
                <p class="text-center"><strong>Comment Frequency</strong></p>
            </div>
            <div class="col-md-4">
                <canvas id="engagementChart"></canvas>
                <p class="text-center"><strong>Engagement Metrics</strong></p>
            </div>
        </div>
    </div>
</body>
</html>
