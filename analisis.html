<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with TikTok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .login-btn {
            background-color: #ff0050;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #e60048;
        }
        .user-info {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Welcome to Our App</h1>
    <p>Login with TikTok to continue</p>

    <!-- Fake "Login with TikTok" Button -->
    <button class="login-btn" onclick="redirectToTikTok()">Login with TikTok</button>

    <!-- Display Mock User Info -->
    <div class="user-info" id="user-info">
        <h2>User Information</h2>
        <p><strong>Name:</strong> <span id="user-name"></span></p>
        <p><strong>Open ID:</strong> <span id="user-id"></span></p>
    </div>

    <script>
        function redirectToTikTok() {
            alert("Redirecting to TikTok Login...");
            window.location.href = "https://www.tiktok.com/auth/authorize";
        }

        // Mock TikTok API Response (Fake User Data)
        const mockUserData = {
            "data": {
                "user": {
                    "display_name": "TestUser",
                    "open_id": "123456789"
                }
            }
        };

        function fetchUserData() {
            console.log("Fetching user data...");
            // Simulating API response delay
            setTimeout(() => {
                document.getElementById("user-name").innerText = mockUserData.data.user.display_name;
                document.getElementById("user-id").innerText = mockUserData.data.user.open_id;
                document.getElementById("user-info").style.display = "block";
            }, 2000); 
        }

        // Simulate user login after redirect (for app review purposes)
        setTimeout(fetchUserData, 3000);
    </script>

</body>
</html>
